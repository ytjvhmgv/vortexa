name: Auto-keep-Vortexa

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 1 点（北京时间 9 点）运行，远小于 2 天的续期窗口

jobs:
  Renew-vortexa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v6

      - name: 🐍 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🌐 启用 WARP 网络
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 🚀 运行续期脚本
        env:
          VORTEXA_EMAIL: ${{ secrets.VORTEXA_EMAIL }}
          VORTEXA_PASSWORD: ${{ secrets.VORTEXA_PASSWORD }}
          VORTEXA_1: ${{ secrets.VORTEXA_1 }}
          VORTEXA_2: ${{ secrets.VORTEXA_2 }}
          VORTEXA_3: ${{ secrets.VORTEXA_3 }}
          VORTEXA_4: ${{ secrets.VORTEXA_4 }}
          VORTEXA_5: ${{ secrets.VORTEXA_5 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 vortexa_keep.py

      - name: 🧹 清理旧的工作流运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
